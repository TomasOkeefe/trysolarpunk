name: daily-video

on:
  schedule:
    - cron: "17 13 * * *"   # 9:17 am New York (EDT); TikTok inbox draft is waiting with your coffee
  workflow_dispatch:
    inputs:
      plan:
        description: "Optional path to a hand-written plan (plans/....json)"
        required: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q anthropic pyyaml vastai
      - name: Make the video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.plan }}" ]; then python run.py --plan "${{ github.event.inputs.plan }}"; else python run.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: video, path: pipeline/out/, retention-days: 14 }
      - name: Save plan + history
        if: always()
        run: |
          git config user.name "grass-enjoyer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add plans history.jsonl || true
          git commit -m "video: $(date -u +%F)" || true
          git push || true
