<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="studio-token" content="__TOKEN__">
<title>Try Solarpunk Studio</title>
<style>
:root {
  --bg: #f4f2ec; --panel: #fffdf8; --ink: #23261f; --muted: #6f7468; --line: #e2ded2;
  --accent: #4f7a3a; --accent-ink: #fff; --keep: #3f8f4f; --redo: #d58a1d; --chip: #ece8dc;
  --me: #e3edd9; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151714; --panel: #1d201b; --ink: #e9ebe4; --muted: #9aa092; --line: #2e322a;
    --accent: #8fbf6b; --accent-ink: #12150f; --keep: #6cc07c; --redo: #f0a940; --chip: #2a2e26; --me: #2b3824; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.on-keep { background: var(--keep); color: #fff; border-color: var(--keep); }
button.on-redo { background: var(--redo); color: #fff; border-color: var(--redo); }

.app { display: grid; grid-template-columns: 250px 1fr 380px; grid-template-rows: 48px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
header h1 span { color: var(--accent); }
#status { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; min-width: 0; }
#status.busy::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--redo); animation: pulse 1.2s infinite; flex: none; }
#conn { margin-left: auto; font-size: 12px; color: var(--muted); }
@keyframes pulse { 50% { opacity: .3; } }

#list { overflow-y: auto; border-right: 1px solid var(--line); padding: 8px; }
.vid { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 8px 10px; border-radius: 10px; margin-bottom: 2px; }
.vid:hover { background: var(--chip); border-color: transparent; }
.vid.sel { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
.vid .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vid .m { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.badge.sent { background: var(--keep); color: #fff; }
.badge.scheduled { background: var(--accent); color: var(--accent-ink); }

#main { overflow-y: auto; padding: 18px 22px 40px; min-width: 0; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.top { display: grid; grid-template-columns: minmax(220px, 330px) 1fr; gap: 22px; align-items: start; }
#player { width: 100%; aspect-ratio: 9 / 16; max-height: 72vh; background: #000; border-radius: 12px; display: block; }
.info h2 { margin: 0 0 4px; font-size: 22px; }
.info .sub { color: var(--muted); margin-bottom: 12px; }
.info .hook { font-weight: 600; margin-bottom: 8px; }
.info .cap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; white-space: pre-wrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; }
details summary { cursor: pointer; color: var(--muted); }
details pre { white-space: pre-wrap; font: inherit; margin: 8px 0 0; }
.counts { color: var(--muted); font-size: 13px; }

h3 { margin: 26px 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
#shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.shot { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.shot.keep { border-color: var(--keep); }
.shot.redo { border-color: var(--redo); }
.shot.now { outline: 3px solid var(--accent); outline-offset: 1px; }
.media { position: relative; aspect-ratio: 9 / 16; background: #000; cursor: pointer; }
.media img, .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.media .n { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
.media .tags { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
.media .tags span { background: rgba(0,0,0,.65); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 99px; }
.media .noclip { color: #aaa; position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; }
.sbody { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.lyric { font-style: italic; font-size: 13px; }
.prompt { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.prompt.open { -webkit-line-clamp: unset; }
.note { font-size: 12px; background: var(--chip); border-radius: 6px; padding: 4px 6px; }
.sbtn { display: flex; gap: 6px; margin-top: auto; }
.sbtn button { flex: 1; padding: 4px 6px; font-size: 12px; }
.redo-box { display: flex; flex-direction: column; gap: 6px; }
.redo-box textarea { width: 100%; resize: vertical; min-height: 54px; border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: var(--bg); }

#chat { display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; }
#log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 8px 11px; border-radius: 12px; word-wrap: break-word; }
.msg.claude { background: var(--bg); border: 1px solid var(--line); align-self: flex-start; }
.msg.owner { background: var(--me); align-self: flex-end; }
.msg .ctx { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.msg .txt p { margin: 0 0 6px; } .msg .txt p:last-child { margin: 0; }
.msg .txt ul { margin: 2px 0 6px; padding-left: 18px; }
.msg code { background: var(--chip); padding: 0 4px; border-radius: 4px; font-size: 12.5px; }
.msg img, .msg video { display: block; max-width: 100%; max-height: 420px; border-radius: 8px; margin-top: 6px; background: #000; }
.msg audio { width: 100%; margin-top: 6px; }
.msg .ts { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
#typing { color: var(--muted); font-size: 12px; padding: 0 14px 6px; display: none; }
#typing.on { display: block; }
form { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
#about { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-height: 20px; }
#about button { padding: 0 6px; font-size: 11px; }
#text { width: 100%; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); min-height: 64px; }
.frow { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; }

@media (max-width: 1150px) {
  .app { grid-template-columns: 220px 1fr; grid-template-rows: 48px 1fr 45vh; }
  #chat { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 720px) {
  .app { display: block; height: auto; }
  #list { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .top { grid-template-columns: 1fr; }
  #main { padding: 16px; }
  #chat { height: 70vh; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Try Solarpunk <span>Studio</span></h1>
    <div id="status"></div>
    <div id="conn">connecting</div>
  </header>
  <nav id="list"></nav>
  <main id="main"><div class="empty">Pick a video on the left.</div></main>
  <aside id="chat">
    <div id="log"><div class="empty" id="hello">Messages here go straight to the Claude Code session, and replies come back here.</div></div>
    <div id="typing">Claude is on it…</div>
    <form id="form">
      <div id="about"></div>
      <textarea id="text" placeholder="Message Claude (Enter to send, Shift+Enter for a new line)"></textarea>
      <div class="frow"><span>Goes straight to the Claude Code session</span><button class="primary" type="submit">Send</button></div>
    </form>
  </aside>
</div>

<script>
const TOKEN = document.querySelector('meta[name=studio-token]').content
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
let videos = [], cur = null, aboutVideo = null, waiting = false

async function post(url, data) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Studio-Token': TOKEN }, body: JSON.stringify(data) })
  if (r.status === 403) { location.reload(); throw new Error('studio restarted') }
  return r.json()
}
const send = (kind, text, extra = {}) => {
  waiting = kind !== 'keep'; $('#typing').classList.toggle('on', waiting)
  return post('/api/send', { kind, text, ...extra })
}

// ---------- video list ----------
async function loadVideos() {
  videos = await (await fetch('/api/videos')).json()
  $('#list').innerHTML = videos.map(v => `
    <button class="vid ${cur && cur.id === v.id ? 'sel' : ''}" data-id="${esc(v.id)}">
      <div class="t">${esc(v.title)}</div>
      <div class="m"><span>${esc(v.date)}</span>${v.product ? `<span>${esc(v.product)}</span>` : ''}
        ${v.post ? `<span class="badge ${esc(v.post)}">${esc(v.post)}</span>` : ''}
        ${videos.filter(x => x.title === v.title).length > 1 ? `<span class="badge">${esc(v.id.slice(11))}</span>` : ''}</div>
    </button>`).join('')
  document.querySelectorAll('.vid').forEach(b => b.onclick = () => open(b.dataset.id))
}

// ---------- one video ----------
async function open(id) {
  location.hash = 'v=' + encodeURIComponent(id)
  $('#main').innerHTML = '<div class="empty">Loading clips…</div>'
  const r = await fetch('/api/video/' + encodeURIComponent(id))
  if (!r.ok) { $('#main').innerHTML = '<div class="empty">Not found.</div>'; return }
  cur = await r.json()
  aboutVideo = cur.id; renderAbout()
  document.querySelectorAll('.vid').forEach(b => b.classList.toggle('sel', b.dataset.id === id))
  renderVideo()
}

function renderVideo() {
  const v = cur
  const marks = v.shots.map(s => s.review?.mark)
  const redo = marks.filter(m => m === 'redo').length, keep = marks.filter(m => m === 'keep').length
  $('#main').innerHTML = `
    <div class="top">
      <video id="player" src="/${esc(v.file)}?t=${v.mtime}" controls playsinline preload="metadata"></video>
      <div class="info">
        <h2>${esc(v.title)}</h2>
        <div class="sub">${esc(v.date)} · ${esc(v.product ?? '')} · ${v.shots.length} shots${v.post ? ' · ' + esc(v.post) : ''}</div>
        ${v.hook ? `<div class="hook">“${esc(v.hook)}”</div>` : ''}
        ${v.caption ? `<div class="cap">${esc(v.caption)}</div>` : ''}
        <div class="actions">
          <button class="primary" id="approve">${v.post ? 'Queued' : 'Approve and queue to post'}</button>
          <button id="sendredos" ${redo ? '' : 'disabled'}>Re-render ${redo} flagged shot${redo === 1 ? '' : 's'}</button>
        </div>
        <div class="counts">${keep} good · ${redo} to redo · ${v.shots.length - keep - redo} unmarked</div>
        ${v.song ? `<details><summary>Song: ${esc(v.song.title)}</summary><pre>${esc(v.song.style)}\n\n${esc(v.song.lyrics)}</pre></details>` : ''}
        ${v.plan ? `<div class="counts">Plan: <code>${esc(v.plan)}</code></div>` : ''}
      </div>
    </div>
    <h3>Shots</h3>
    ${v.shots.length ? '' : '<div class="empty">No plan found for this video.</div>'}
    <div id="shots">${v.shots.map(shotCard).join('')}</div>`
  $('#approve').onclick = () => {
    if (v.post) return
    send('approve', 'Looks good, queue it to post on its date.', { video: v.id })
    $('#approve').textContent = 'Sent to Claude'
  }
  $('#sendredos').onclick = () => {
    const list = v.shots.filter(s => s.review?.mark === 'redo').map(s => `shot ${s.i}: ${s.review.note || '(no note)'}`).join('\n')
    send('chat', 'Please re-render the flagged shots and re-edit the video:\n' + list, { video: v.id })
  }
  wireShots()
  const pl = $('#player')
  pl.ontimeupdate = () => {
    const t = pl.currentTime
    let now = -1
    v.shots.forEach(s => { if (s.start !== null && t >= s.start) now = s.i })
    document.querySelectorAll('.shot').forEach(c => c.classList.toggle('now', +c.dataset.i === now && !pl.paused))
  }
}

function shotCard(s) {
  const m = s.review?.mark
  return `
  <div class="shot ${m ?? ''}" data-i="${s.i}">
    <div class="media" title="${s.start !== null ? 'Click to play this moment in the video' : ''}">
      ${s.thumb ? `<img src="/${esc(s.thumb)}" loading="lazy" alt="">` : '<div class="noclip">no clip saved</div>'}
      <span class="n">#${s.i}</span>
      <span class="tags">${s.sing ? '<span>sings</span>' : ''}${s.product ? '<span>product</span>' : ''}</span>
    </div>
    <div class="sbody">
      ${s.lyric ? `<div class="lyric">♪ ${esc(s.lyric)}</div>` : ''}
      <div class="prompt">${esc(s.prompt)}</div>
      ${m === 'redo' && s.review.note ? `<div class="note">Redo: ${esc(s.review.note)}</div>` : ''}
      <div class="sbtn">
        <button data-a="keep" class="${m === 'keep' ? 'on-keep' : ''}">Good</button>
        <button data-a="redo" class="${m === 'redo' ? 'on-redo' : ''}">Redo</button>
      </div>
    </div>
  </div>`
}

function wireShots() {
  document.querySelectorAll('.shot').forEach(card => {
    const s = cur.shots[+card.dataset.i]
    const media = card.querySelector('.media')
    if (s.clip) {
      media.onmouseenter = () => {
        if (media.querySelector('video')) return
        const v = document.createElement('video')
        v.src = '/' + s.clip; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true
        media.appendChild(v)
      }
      media.onmouseleave = () => media.querySelector('video')?.remove()
    }
    media.onclick = () => {
      const pl = $('#player')
      if (s.start === null || !pl) return
      pl.currentTime = s.start + 0.01; pl.play(); pl.scrollIntoView({ behavior: 'smooth', block: 'center' })
    }
    card.querySelector('.prompt').onclick = e => e.target.classList.toggle('open')
    card.querySelector('[data-a=keep]').onclick = async () => {
      if (s.review?.mark === 'keep') { await post('/api/unmark', { video: cur.id, shot: s.i }); s.review = null }
      else { await send('keep', '', { video: cur.id, shot: s.i }); s.review = { mark: 'keep' } }
      rerenderCard(card, s)
    }
    card.querySelector('[data-a=redo]').onclick = () => openRedo(card, s)
  })
}

function rerenderCard(card, s) {
  const tmp = document.createElement('div'); tmp.innerHTML = shotCard(s)
  card.replaceWith(tmp.firstElementChild); wireShots(); renderCountsOnly()
}

function renderCountsOnly() {
  const marks = cur.shots.map(s => s.review?.mark)
  const redo = marks.filter(m => m === 'redo').length, keep = marks.filter(m => m === 'keep').length
  document.querySelector('.counts').textContent = `${keep} good · ${redo} to redo · ${cur.shots.length - keep - redo} unmarked`
  const b = $('#sendredos'); b.disabled = !redo; b.textContent = `Re-render ${redo} flagged shot${redo === 1 ? '' : 's'}`
}

function openRedo(card, s) {
  const sb = card.querySelector('.sbtn')
  if (card.querySelector('.redo-box')) return
  const box = document.createElement('div'); box.className = 'redo-box'
  box.innerHTML = `<textarea placeholder="What's wrong? (the guitarist looks naked, no ball visible…)">${esc(s.review?.mark === 'redo' ? s.review.note : '')}</textarea>
    <div class="sbtn"><button data-x>Cancel</button>${s.review?.mark === 'redo' ? '<button data-u>Unflag</button>' : ''}<button class="primary" data-ok>Flag</button></div>`
  sb.replaceWith(box)
  const ta = box.querySelector('textarea'); ta.focus()
  box.querySelector('[data-x]').onclick = () => rerenderCard(card, s)
  box.querySelector('[data-u]')?.addEventListener('click', async () => { await post('/api/unmark', { video: cur.id, shot: s.i }); s.review = null; rerenderCard(card, s) })
  box.querySelector('[data-ok]').onclick = async () => {
    const note = ta.value.trim()
    await send('redo', note, { video: cur.id, shot: s.i })
    s.review = { mark: 'redo', note }; rerenderCard(card, s)
  }
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); box.querySelector('[data-ok]').click() } }
}

// ---------- chat ----------
function md(t) {
  const lines = esc(t).split('\n'); let out = '', list = false
  for (const l of lines) {
    const li = /^\s*[-*•]\s+(.*)/.exec(l)
    if (li) { if (!list) { out += '<ul>'; list = true } out += `<li>${inline(li[1])}</li>`; continue }
    if (list) { out += '</ul>'; list = false }
    if (l.trim()) out += `<p>${inline(l)}</p>`
  }
  return out + (list ? '</ul>' : '')
}
const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')

function fileEl(f) {
  const ext = f.name.split('.').pop().toLowerCase(), u = esc(f.url)
  if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return `<a href="${u}" target="_blank"><img src="${u}" alt="${esc(f.name)}"></a>`
  if (['mp4', 'mov', 'webm'].includes(ext)) return `<video src="${u}" controls playsinline preload="metadata"></video>`
  if (['mp3', 'wav', 'flac', 'm4a'].includes(ext)) return `<audio src="${u}" controls></audio>`
  return `<a href="${u}" target="_blank">${esc(f.name)}</a>`
}

function addMsg(m) {
  if (document.getElementById('msg-' + m.id)) return
  if (m.kind === 'keep') return
  const d = document.createElement('div')
  d.id = 'msg-' + m.id
  d.className = 'msg ' + (m.from === 'claude' ? 'claude' : 'owner')
  const ctx = m.from === 'owner' && (m.video || m.kind !== 'chat')
    ? `<div class="ctx">${m.kind === 'redo' ? 'Redo' : m.kind === 'approve' ? 'Approve' : 'About'} ${esc(m.video ?? '')}${Number.isInteger(m.shot) ? ' · shot ' + m.shot : ''}</div>` : ''
  d.innerHTML = ctx + `<div class="txt">${md(m.text || (m.kind === 'redo' ? '(no note)' : ''))}</div>`
    + (m.files ?? []).map(fileEl).join('')
    + `<div class="ts">${new Date(m.ts).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</div>`
  const log = $('#log'), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80
  $('#hello')?.remove()
  log.appendChild(d)
  if (atBottom || m.from === 'owner') log.scrollTop = log.scrollHeight
}

function renderAbout() {
  $('#about').innerHTML = aboutVideo ? `About: <b>${esc(aboutVideo)}</b> <button type="button" id="detach">×</button>` : 'General message'
  $('#detach')?.addEventListener('click', () => { aboutVideo = null; renderAbout() })
}

$('#form').onsubmit = async e => {
  e.preventDefault()
  const text = $('#text').value.trim()
  if (!text) return
  $('#text').value = ''
  await send('chat', text, aboutVideo ? { video: aboutVideo } : {})
}
$('#text').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#form').requestSubmit() } }

// ---------- live updates ----------
function connect() {
  const es = new EventSource('/events')
  es.onopen = () => { $('#conn').textContent = 'connected' }
  es.onerror = () => { $('#conn').textContent = 'reconnecting…' }
  es.onmessage = e => {
    const ev = JSON.parse(e.data)
    if (ev.type === 'msg') {
      addMsg(ev)
      if (ev.from === 'claude') { waiting = false; $('#typing').classList.remove('on') }
    }
    if (ev.type === 'status') { $('#status').textContent = ev.text; $('#status').classList.toggle('busy', !!ev.text) }
    if (ev.type === 'videos') loadVideos()
  }
}

;(async () => {
  renderAbout()
  ;(await (await fetch('/api/chat')).json()).forEach(addMsg)
  $('#log').scrollTop = $('#log').scrollHeight
  await loadVideos()
  const h = /v=([^&]+)/.exec(location.hash)
  if (h) open(decodeURIComponent(h[1]))
  connect()
})()
</script>
</body>
</html>
