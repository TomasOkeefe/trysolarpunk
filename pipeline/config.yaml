# Try Solarpunk content pipeline config

brand:
  name: Try Solarpunk
  handle: "@trysolarpunk"
  tagline: Gear for recovering scrollers
  voice: >
    Warm, a little unhinged, never preachy. Deeply online people who want out, laughing at
    ourselves on the way. Solarpunk hope, not doom. The joke is always on the feed, never on the
    person. Never shame viewers for using their phones. Never use real people, real brands, or
    real politicians.
  palette: [moss "#2F5D3A", sprout "#9BC53D", sun "#F2C14E", cream "#F6F1E4", clay "#D9764A"]

# What the videos sell. The concept step rotates through these.
products:
  - id: hibernator
    name: Hibernator
    pitch: A quilted brick that sticks to your fridge, a sleeping bag for your phone. It goes in face to the wall. Tap the sun badge and it switches on your Focus mode.
    visual: a small quilted moss-green 3D-printed brick shaped like a puffy sleeping bag, on a cream fridge door, holding a phone upright face to the door, a round sun-yellow badge with a black closed eye on its front
    image: assets/hib_fridge.jpg     # used as the first frame of the product shot
  - id: eyelid
    name: Eyelid
    pitch: A sleeve that fully covers your screen, so notifications can't pull you in. Its top edge is a closed eyelid, so your phone looks asleep.
    visual: a slim terracotta-orange 3D-printed sleeve whose top edge is cut like a closed eyelid with a black liner and lashes, a phone tucked inside
    image: assets/eyelid_studio.jpg
  - id: merch
    name: Infinite Stroll tee
    pitch: No feed. No ads. No end.
    visual: a cream t-shirt with a hills-and-infinity-path illustration and the words Infinite Stroll

video:
  width: 1080
  height: 1920
  fps: 24
  target_seconds: 52        # before the 3 s end card; 16-line songs (verse, chorus x2) fill it
  shots: 32                 # clips per video: ~2 s each, two per sung line (ge.timeline); the owner liked this pace
  speed: 1.3                # clips play this much faster than rendered (snappier motion); singing stays 1x
  render: dfr               # dfr = LTX's production path (fewer artifacts, lip-synced singing); distilled = fastest
  gen_width: 768            # LTX output size (stage 1 renders at half), 9:16-ish, divisible by 64
  gen_height: 1344
  clip_frames: 121          # 8k+1 frames -> ~5 s at 24 fps
  # Look of every shot except the product shot (which starts from our real render): a name from
  # `styles` below. A plan can pick its own with "style": "<name>" ("" = none). Hand-made looks hide AI glitches.
  style: claymation
  anim_fps: 12              # frames held "on twos" for a hand-animated feel; null for smooth 24 fps
  # No AI label is burned in: TikTok shows its own when the AI-generated toggle is on.

# Recurring characters. Write {moss} in a shot prompt and it becomes this exact description, so the
# character looks the same in every shot and every video. Keep the traits bold and simple.
characters:
  moss: >-
    a small round plasticine man with a big round head, rosy cheeks, a bushy brown mustache, round
    black glasses, a moss-green knitted beanie with a yellow pom-pom, a mustard-yellow raincoat and
    green rubber boots
  # Moss with his back to the camera. Use {moss_back} whenever he is seen from behind: {moss} lists his
  # face, so the model shows it anyway and twists his head right round (owner, 2026-11-11).
  moss_back: >-
    a small round plasticine man seen from behind, his back to the camera, his face turned away and
    hidden: the back of a moss-green knitted beanie with a yellow pom-pom, the back of a
    mustard-yellow raincoat with its hood, and green rubber boots

# Character LoRAs (train_lora.py): none in use. Moss is held by first frames instead (ge/frames.py): an
# image-editing model draws the opening still of each of his shots from his master pictures and LTX
# animates from it. LoRAs never held him exactly (2026-11-11): the first one (moss-v1-1500, 28 clips, on the
# `moss-lora` GitHub release) let him drift at 0.3; a second trained on 71 clips of one Moss
# (videos/lora/moss2/) was right at 0.7+ but washed the sets out, and at 0.5 the model's own Moss leaked back.
# To use one again: loras: {moss: {url: ..., trigger: m0ss, strength: 0.5}}.
loras: {}

styles:
  claymation: >-
    Claymation stop-motion animation, handmade plasticine characters with visible thumbprints
    and slightly wonky proportions, miniature handmade set, soft studio light.
  felt: >-
    Cut-paper and felt stop-motion animation, layered construction-paper shapes and fuzzy felt
    characters with button eyes, slightly jittery movement, warm craft-table light.
  printed: >-
    Stop-motion animation of 3D-printed plastic toys, matte PLA figures and sets in bright solid
    colours with visible fine layer lines, chunky rounded shapes, slightly jerky toy movement,
    miniature diorama, soft daylight.

# The same looks for shots with nobody in them (objects, scenery, the merch product shot). The styles above
# say "characters", so LTX adds blank beige clay figures to a shot of a raindrop or a pair of boots
# (2026-11-11). ge/frames.py marks such shots "props"; they get this style and the tail after the prompt.
props_styles:
  claymation: >-
    Claymation stop-motion film, handmade plasticine props and scenery with visible thumbprints,
    miniature handmade set, soft studio light.
  felt: >-
    Cut-paper and felt stop-motion film, layered construction-paper shapes and fuzzy felt props and
    scenery, slightly jittery movement, warm craft-table light.
  printed: >-
    Stop-motion film of 3D-printed plastic props and scenery, matte PLA in bright solid colours with
    visible fine layer lines, chunky rounded shapes, miniature diorama, soft daylight.
props_tail: "Nobody is in the shot: no people, no characters, no figures."

gpu:
  # which GPUs, cheapest first: TIERS in ge/runpod.py
  disk_gb: 160
  image: runpod/pytorch:1.4.0-cu1281-torch280-ubuntu2404
  max_runtime_minutes: 210  # hard kill so a stuck box can't burn money (7 videos: ~75 min on 48 GB, ~165 on a 3090)

posting:
  # TikTok posts go through Buffer's free plan (ge/buffer.py); videos are hosted on R2 until sent
  channel_id: 6ad21b1d778b240e2f28c366     # Buffer channel for @trysolarpunk
  organization_id: 6ad21a9eb20703c768d73c05
  timezone: America/New_York
  default_time: "18:00"                   # when Buffer has no slot that weekday
  daily_times: ["12:00", "19:00", "15:30"]  # for queue --per-day (first n used)
  bucket: trysolarpunk-media              # R2, Standard class, 30-day expiry rule
  cloudflare_account: 83c3790251e34cce0d1bb108446631a8
  public_url: https://pub-0bed9458521a4a2a8f926a6d87473c61.r2.dev
